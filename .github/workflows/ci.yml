name: CI

on:
  push:
    branches: [develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, vet, test, and vulnerability scan
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Check local documentation links
        run: python3 scripts/check-doc-links.py

      - name: Vet
        run: go vet ./...

      - name: Test with race detector and coverage
        run: go test -race -cover ./...

      - name: Scan Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Build terminal journey binary
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags '-s -w' -o dist/exodock ./cmd/exodock

      - name: Install terminal test dependencies
        run: |
          python3 -m venv /tmp/exodock-terminal-tests
          /tmp/exodock-terminal-tests/bin/pip install -r test/terminal/requirements.txt

      - name: Verify installed command outside the source directory
        run: |
          exodock_install_dir="$(mktemp -d)"
          make install PREFIX="$exodock_install_dir"
          cd /tmp
          PATH="$exodock_install_dir/bin:$PATH" exodock --version
          PATH="$exodock_install_dir/bin:$PATH" exodock --help

      - name: Exercise keyboard journeys and terminal restoration
        run: /tmp/exodock-terminal-tests/bin/python test/terminal/smoke.py dist/exodock

  cross-build:
    name: Build ${{ matrix.goos }} / ${{ matrix.goarch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          # Windows is an experimental compile target until named-pipe support
          # and the terminal experience pass platform-specific validation.
          - goos: windows
            goarch: amd64
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: true

      - name: Build distributable binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -trimpath -ldflags '-s -w' -o dist/ ./cmd/exodock

      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exodock-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error

  docker-integration:
    name: Docker integration tests
    runs-on: ubuntu-24.04
    env:
      EXODOCK_INTEGRATION: '1'
      EXODOCK_TEST_IMAGE: alpine:3.22
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: true

      - name: Check Docker Engine
        run: docker info

      - name: Prepare integration fixture image
        run: docker pull "$EXODOCK_TEST_IMAGE"

      - name: Run integration tests
        run: go test -race -cover ./...
